services:
  webserver:
    image: "mattp:moodle_dev"
    depends_on:
      - db
    volumes:
      - "${MOODLE_DOCKER_WWWROOT}:/var/www/html"
      - "${ASSETDIR}/web/apache2_faildumps.conf:/etc/apache2/conf-enabled/apache2_faildumps.conf"
      # Instance TLS leaf certs mounted as individual files so the image's
      # baked-in CA bundle (/etc/ssl/certs/ca-certificates.crt) stays visible.
      - "${MOODLE_DOCKER_CERTS_DIR:-./moodle_dev/assets/certs}/webserver.crt:/etc/ssl/certs/webserver.crt"
      - "${MOODLE_DOCKER_CERTS_DIR:-./moodle_dev/assets/certs}/webserver.key:/etc/ssl/certs/webserver.key"
    tmpfs:
      - /muc
    environment:
      MOODLE_DOCKER_DBNAME: "${MOODLE_DOCKER_DBNAME}"
      MOODLE_DOCKER_DBUSER: "${MOODLE_DOCKER_DBUSER}"
      MOODLE_DOCKER_DBPASS: "${MOODLE_DOCKER_DBPASS}"
      MOODLE_DOCKER_BROWSER: "${MOODLE_DOCKER_BROWSER}"
      MOODLE_DOCKER_BEHAT_MODE: "${MOODLE_DOCKER_BEHAT_MODE}"
      MOODLE_DOCKER_BEHAT_PARALLEL: "${MOODLE_DOCKER_BEHAT_PARALLEL}"
      MOODLE_DOCKER_WEB_HOST: "${MOODLE_DOCKER_WEB_HOST}"
      MOODLE_DOCKER_WEB_HOSTNAME: "${MOODLE_DOCKER_WEB_HOSTNAME:-webserver}"
      PHP_IDE_CONFIG: "serverName=moodle-local"
    ports:
      - "${MOODLE_DOCKER_BIND_IP:-127.0.0.1}:443:443"
    networks:
      default:
        aliases:
          - "${MOODLE_DOCKER_WEB_HOSTNAME:-webserver}"
  exttests:
    image: moodlehq/moodle-exttests
    volumes:
      - "${ASSETDIR}/exttests/apache2_ports.conf:/etc/apache2/ports.conf"
      - "${ASSETDIR}/exttests/apache2.conf:/etc/apache2/sites-enabled/000-default.conf"
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    entrypoint: ["/opt/keycloak/bin/kc.sh", "start-dev", "--import-realm"]
    volumes:
      - "${MOODLE_DOCKER_KEYCLOAK_DATA_DIR:-./keycloak/data}:/opt/keycloak/data"
      - "./keycloak/keycloak.conf:/opt/keycloak/conf/keycloak.conf"
      - "${MOODLE_DOCKER_CERTS_DIR:-./moodle_dev/assets/certs}/:/etc/ssl/certs/"
    ports:
      - "${MOODLE_DOCKER_BIND_IP:-127.0.0.1}:8080:8080"
      - "${MOODLE_DOCKER_BIND_IP:-127.0.0.1}:8443:8443"
    networks:
      default:
        aliases:
          - "${MOODLE_DOCKER_KEYCLOAK_HOSTNAME:-keycloak}"
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/keycloak/8080; printf 'GET /realms/moodle/.well-known/openid-configuration HTTP/1.1\\r\\nHost: keycloak\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q 'HTTP/1.1 200' <&3" ]
      interval: 30s
      timeout: 10s
      retries: 5
networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: "${MOODLE_DOCKER_SUBNET:-172.32.238.0/24}"
          gateway: "${MOODLE_DOCKER_GATEWAY:-172.32.238.1}"

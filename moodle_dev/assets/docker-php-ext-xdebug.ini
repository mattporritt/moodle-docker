; Settings for Xdebug Docker configuration
xdebug.mode = debug
xdebug.client_host = host.docker.internal
zend_extension=xdebug
; Only start a debug session when explicitly requested (the Xdebug Helper browser extension
; documented in README.md's PHPStorm Setup section, or an XDEBUG_TRIGGER cookie/param/header),
; not on every request. With "yes", every single HTTP request - including every small JS/ESM
; module file the browser fetches - pays Xdebug's connection-attempt cost even when no IDE is
; listening, which under a JS-module-heavy page (many small files fetched individually) can add
; up to several seconds of pure debugger overhead with nothing to show for it. Measured directly
; against MDL-89636's dashboard: turning this off roughly halved per-request latency in one A/B
; comparison, though run-to-run noise in a shared dev container made the exact multiplier hard to
; pin down - it's a real cost either way. "trigger" keeps on-demand step debugging fully working.
xdebug.start_with_request=trigger
